<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spillgebees.Blazor.RichTextEditor — Docs</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Spillgebees.Blazor.Docs.Sdk/docs-sdk.css" />
    <link rel="stylesheet" href="_content/Spillgebees.Blazor.RichTextEditor/Spillgebees.Blazor.RichTextEditor.lib.module.css" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
          integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
          crossorigin="anonymous" />
    <style>
        .editor-sample-status {
            display: grid;
            gap: 0.35rem;
            padding: 0.8rem;
            margin-top: 0.75rem;
            color: var(--color-text-secondary);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            overflow-wrap: anywhere;
        }

        .editor-sample-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .editor-sample-button {
            padding: 0.45rem 0.8rem;
            color: var(--color-text);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            cursor: pointer;
            font: inherit;
        }

        .editor-sample-button:hover {
            border-color: var(--color-primary);
        }

        .ql-font-RobotoMono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="doc-loading">Loading documentation…</div>
    </div>
    <script defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
            integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
            crossorigin="anonymous"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
