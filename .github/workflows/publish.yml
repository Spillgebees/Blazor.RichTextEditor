name: Publish nuget package

permissions: {}

on:
  release:
    types: [published]

jobs:
  build-and-test:
    name: build-and-test
    uses: ./.github/workflows/build-test-publish.yml
    with:
      should-package: true

  publish:
    name: publish
    needs: [build-and-test]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write

    steps:
      - name: 🔃 download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts
          path: .

      - name: 📦 setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6

      # trusted publishing: nuget.org only hands out a key to this workflow
      # running in the `nuget` environment, which only tags can reach
      - name: 🔑 log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: 🚀 publish nuget packages
        run: dotnet nuget push "*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
