name: Build, test, & publish

permissions: {}

on:
  workflow_call:
    inputs:
      should-package:
        type: boolean
        description: Whether to package project and upload as artifact.
        default: false
      should-run:
        type: boolean
        description: Whether to run the job.
        default: true
      dotnet-changed:
        type: boolean
        description: Whether .NET source files changed.
        default: true
      ts-changed:
        type: boolean
        description: Whether TypeScript source files changed.
        default: true
      should-publish-gh-page:
        type: boolean
        description: Whether to publish the WASM application to gh-pages.
        default: false
      gh-page-destination-directory:
        type: string
        description: The destination directory for the WASM application.
        default: ""

jobs:
  build-test-publish:
    name: build-test-publish
    if: inputs.should-run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: src/Spillgebees.Blazor.RichTextEditor.Assets/package.json

      - name: 📦 setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/Spillgebees.Blazor.RichTextEditor.Assets/pnpm-lock.yaml

      - name: 📦 setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          global-json-file: global.json

      - name: 📦 restore packages
        run: dotnet restore Spillgebees.Blazor.RichTextEditor.slnx

      - name: 👷 build project
        run: dotnet build --configuration Release --no-restore Spillgebees.Blazor.RichTextEditor.slnx

      - name: 🔍 lint TypeScript
        if: inputs.ts-changed
        run: pnpm run lint
        working-directory: src/Spillgebees.Blazor.RichTextEditor.Assets

      - name: ✅ test .NET
        if: inputs.dotnet-changed
        run: dotnet test --solution Spillgebees.Blazor.RichTextEditor.slnx --configuration Release --no-build

      - name: ✅ test TypeScript
        if: inputs.ts-changed
        run: pnpm run test
        working-directory: src/Spillgebees.Blazor.RichTextEditor.Assets

      - name: 📦 package the application
        if: inputs.should-package
        run: dotnet pack src/Spillgebees.Blazor.RichTextEditor/Spillgebees.Blazor.RichTextEditor.csproj --configuration Release --no-build --output package

      - name: 🔃 upload artifacts
        if: inputs.should-package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts
          if-no-files-found: error
          retention-days: 1
          path: package/*.nupkg

      - name: 📦 publish WASM application as with .NET 10.0
        if: inputs.should-publish-gh-page
        run: dotnet publish src/Spillgebees.Blazor.RichTextEditor.Samples/Spillgebees.Blazor.RichTextEditor.Samples.Wasm/Spillgebees.Blazor.RichTextEditor.Samples.Wasm.csproj --configuration Release --no-build --output wasm-application/net10.0 --framework net10.0

      - name: 🔧 fix base path for .NET 10.0
        if: inputs.should-publish-gh-page
        run: sed -i 's/<base href="\/" \/>/<base href="\/Blazor.RichTextEditor\/main\/net10\.0\/" \/>/g' wasm-application/net10.0/wwwroot/index.html

      - name: 🚀 deploy .NET 10.0 gh page
        if: inputs.should-publish-gh-page
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./wasm-application/net10.0/wwwroot
          destination_dir: ${{ inputs.gh-page-destination-directory }}/net10.0
          enable_jekyll: false
